name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: ./dist
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
      - name: Smoke check staging site
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
          STAGING_SITE_URL: ${{ vars.STAGING_SITE_URL }}
        run: |
          SITE_URL="$STAGING_SITE_URL"
          if [ -z "$SITE_URL" ]; then
            echo "STAGING_SITE_URL not set; looking up Netlify site $NETLIFY_SITE_ID"
            SITE_URL=$(curl -fsS -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
              "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID" \
              | python3 -c 'import json,sys; data=json.load(sys.stdin); print(data.get("ssl_url") or data.get("url") or "")')
          fi
          if [ -z "$SITE_URL" ]; then
            echo "Could not resolve staging site URL"
            exit 1
          fi
          echo "Checking $SITE_URL"
          curl -fsS "$SITE_URL" >/dev/null
