services:
  web:
    build:
      context: .
      args:
        VITE_API_BASE_URL: http://localhost:3000
        # Staging Firebase web config / local stub (pair with backend FIREBASE_AUTH_STUB).
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_AUTH_STUB: ${VITE_AUTH_STUB:-true}
        VITE_MIXPANEL_TOKEN: ${VITE_MIXPANEL_TOKEN:-}
    ports:
      - "5173:80"
    # Pair with backend Compose (`api` on :3000). CORS must allow http://localhost:5173.
